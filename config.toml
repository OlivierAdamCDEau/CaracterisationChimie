[theme]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f7ff"
textColor = "#1e3a5f"
font = "sans serif"

[server]
maxUploadSize = 500
# Redémarre automatiquement l'app après un crash (Streamlit Cloud Community)
headless = true

[browser]
gatherUsageStats = false

[runner]
# Relancer le script automatiquement en cas d'exception non gérée
fastReruns = true
